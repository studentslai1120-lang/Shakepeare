<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>莎士比亞冷僻詞彙 A–Z</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <h1>莎士比亞冷僻詞彙 A–Z</h1>
  <p class="sub">日常幾乎用不到的文學詞彙，每個字母一個：看畫、聽發音、讀出自劇本的名句。也可以直接按鍵盤字母鍵。</p>
  <nav id="idx" aria-label="選擇字母"></nav>
  <article class="card" aria-live="polite">
    <figure class="pic">
      <img id="pic" alt="">
      <span class="badge" id="lt"></span>
      <figcaption id="cap"></figcaption>
    </figure>
    <div class="info">
      <h2 class="w" id="w"></h2>
      <p class="ipa" id="ipa"></p>
      <p class="zh" id="zh"></p>
      <p class="note" id="note"></p>
      <blockquote id="q"></blockquote>
      <p class="src" id="src"></p>
      <div class="row">
        <button class="act" id="sw" type="button">🔊 單字</button>
        <button class="act alt" id="sq" type="button">🔊 金句</button>
        <button class="ghost" id="stop" type="button">■ 停止</button>
        <label class="note" for="rate">語速</label>
        <select id="rate" class="ghost"><option value="0.75">慢</option><option value="0.9">稍慢</option><option value="1" selected>正常</option></select>
      </div>
      <p class="status" id="status" role="status"></p>
      <div class="row">
        <button class="ghost" id="pv" type="button">← 上一個</button>
        <button class="ghost" id="nx" type="button">下一個 →</button>
      </div>
    </div>
  </article>
</main>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
